<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfyRooms</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-menu" class="screen">
        <h1 class="game-title">INFYROOMS</h1>
        <div class="account-balance">
            <div class="stat-box">ID: <span id = "account-id">???</span></div>
            <div class="stat-box">Username: <span id = "account-username">???</span></div>
            <div class="currency-grid">
                <div class="stat-box">🌟Xp:<span id="account-xp">0</span></div>
                <div class="stat-box">💰 <span id="account-gold">0</span></div>
                <div class="stat-box">💎 <span id="account-gems">0</span></div>
                <div class="stat-box">⚡ <span id="energy-val">7</span>/7</div>
            </div>
        </div>
         <div class="left-wing">
            <button class="btn-side" disabled>🎁 <br> Events</button>
            <button class="btn-side" disabled>🏆 <br> Tops</button>
            <button class="btn-side" disabled>🛒 <br>Shop</button>
            <button class="btn-side" disabled>🎭 <br> Customs </button>
        </div>

        <div class="right-grid">
            <button class = "btn-side" disabled>🔁 <br> Transfer</button>
        </div>
        
        <div class="lobby-door-wrapper">
            <div class="lobby-door">🚪</div>
            <div class="particles-container" id="particles-container"></div>
        </div>
        <button id="btn-play" class="btn-main">Play</button>
    </div>

    <div id="game-screen" class="screen hidden">
        <div class="game-header">
            <div class="stat-box rucksack">
                <span class="rucksack-title">🎒 Backpack:</span>
                <span id="loot-summary">✨0 XP | 💰0 | 💎0 </span>
            </div>
            <div class="stat-box">🚪 Room: <span id="room-step">1</span></div>
        </div>

        <div class="doors-container">
            <div class="door" data-id="0">🚪</div>
            <div class="door" data-id="1">🚪</div>
            <div class="door" data-id="2">🚪</div>
        </div>

        <div class="game-controls">
            <button id="btn-cashout" class="btn-action">💰Collect and quit</button>
        </div>
    </div>

    <div id="result-overlay" class="overlay hidden">
        <div class="overlay-content">
            <div id="result-emoji" class="result-big-emoji">💰</div>
            <h2 id="result-text">You got a reward!</h2>
            <button id="btn-continue" class="btn-main">Continue</button>
        </div>
    </div>
    
    <script type="module" src="game.js"></script>
</body>
</html>
