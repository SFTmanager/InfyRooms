<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfyRooms</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Добавлена версия ?v=1.0.2 для гарантированного обхода кэша Telegram -->
    <link rel="stylesheet" href="style.css?v=1.0.3">
</head>
<body>
    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="screen">
        <h1 class="game-title">INFYROOMS</h1>
        
        <div class="account-balance">
            <div class="xp-bar-container">ID: <span id="account-id">???</span> | @<span id="account-username">???</span></div>
            <div class="currency-grid">
                <div>🌟 <span id="account-xp">0</span></div>
                <div>💰 <span id="account-gold">0</span></div>
                <div>💎 <span id="account-gems">0</span></div>
                <div>⚡ <span id="energy-val">7</span>/7</div>
            </div>
        </div>

         <div class="left-wing">
            <button class="btn-side" disabled>🎁 <br> Events</button>
            <button class="btn-side" disabled>🏆 <br> Tops</button>
            <button class="btn-side" disabled>🛒 <br> Shop</button>
            <button id="btn-customs" class="btn-side" style="opacity:1; color:#fff;">🎭 <br> Customs</button>
        </div>

        <div class="right-grid">
            <button id="btn-inventory" class="btn-side" style="opacity:1; color:#fff;">🎒 <br> Inventory</button>
        </div>

        <button id="btn-play" class="btn-main">Play</button>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="game-screen" class="screen hidden">
        <div class="game-header">
            <div class="stat-box rucksack">
                <span class="rucksack-title">🎒 Backpack:</span>
                <span id="loot-summary">✨0 XP | 💰0 | 💎0 </span>
            </div>
            <div class="stat-box">🚪 Room: <span id="room-step">1</span></div>
        </div>

        <div class="doors-container">
            <div class="door" data-id="0">🚪</div>
            <div class="door" data-id="1">🚪</div>
            <div class="door" data-id="2">🚪</div>
        </div>

        <div class="game-controls">
            <button id="btn-cashout" class="btn-action">💰Collect and quit</button>
        </div>
    </div>

    <!-- ЭКРАН МАГАЗИНА СУЩЕСТВ (CUSTOMS) -->
    <div id="customs-screen" class="screen hidden">
        <h2 class="game-title">CUSTOMS SHOP</h2>
        <p style="text-align:center; color:#8c72b0; font-size:13px; font-weight:bold; margin-bottom:5px;">
            Next Restock in: <span id="shop-timer" style="color:#00ffff;">24:00:00</span>
        </p>
        
        <!-- Контейнер для свайпа 4 товаров -->
        <div id="shop-items-container" class="shop-grid"></div>
        
        <button id="btn-close-customs" class="btn-main">Back to Menu</button>
    </div>

    <!-- ЭКРАН ИНВЕНТАРЯ -->
    <div id="inventory-screen" class="screen hidden">
        <h2 class="game-title">YOUR ENTITIES</h2>
        
        <div id="inventory-container" class="inventory-grid"></div>
        
        <button id="btn-close-inventory" class="btn-main">Back to Menu</button>
    </div>

    <!-- ОВЕРЛЕЙ РЕЗУЛЬТАТОВ -->
    <div id="result-overlay" class="overlay hidden">
        <div class="overlay-content">
            <div id="result-emoji" class="result-big-emoji">💰</div>
            <h2 id="result-text">You got a reward!</h2>
            <button id="btn-continue" class="btn-main">Continue</button>
        </div>
    </div>
    
    <script type="module" src="game.js"></script>
</body>
</html>
