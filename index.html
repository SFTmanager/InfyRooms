<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfyRooms</title>
    
    <!-- ВАЖНО: Подключаем Telegram WebApp SDK в первую очередь -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel = "stylesheet" href = "newstyle.css">
</head>
<body>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="screen">
        <h2>🚪 InfyRooms</h2>
        <div style="margin: 15px 0;">
            🌟 Опыт: <span id="account-xp">0</span> | 
            CNY: <span id="account-gold">0</span> | 
            💎 Кристаллы: <span id="account-gems">0</span>
        </div>
        <div style="font-size: 1.2rem; margin: 15px 0;">
            ⚡ Энергия: <span id="energy-val">0</span> / 7
        </div>
        <button id="btn-play">ИГРАТЬ</button>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="game-screen" class="screen hidden">
        <h3>Комната №<span id="room-step">1</span></h3>
        <div id="loot-summary">✨0 XP | 💰0 | 💎0</div>
        
        <div class="doors-container">
            <div class="door" data-id="0">🚪</div>
            <div class="door" data-id="1">🚪</div>
            <div class="door" data-id="2">🚪</div>
        </div>

        <button id="btn-cashout">💸 ЗАБРАТЬ ЛУТ И СБЕЖАТЬ</button>
    </div>

    <!-- ОКНО РЕЗУЛЬТАТА КОМНАТЫ -->
    <div id="result-overlay" class="overlay hidden">
        <div class="overlay-content">
            <div id="result-emoji" style="font-size: 4rem; margin-bottom: 10px;">🚪</div>
            <p id="result-text">Текст результата</p>
            <button id="btn-continue">ПРОДОЛЖИТЬ</button>
        </div>
    </div>

    <!-- ВАЖНО: Скрипт игры подключается как type="module" -->
    <script type="module" src="game.js"></script>
</body>
</html>
